version: 1
artifact_requirements:
  purpose: Add the exact user-approved email address to the public contact page.
  audience: Research collaborators, Ph.D. admissions readers, and AI engineering collaborators.
  language: en
  output_path: generated/site-content.md and content/profile.json
  required_sections:
    - contact
selectors:
  include:
    - current Wiki-supported public website claims
    - exact contact email found in the authoritative profile and explicitly approved by the user for public release
  exclude:
    - all other application and school emails
    - phone number, date of birth, address, citizenship, mobility, and referee records
    - stale or superseded wording
    - unverified GPA/rank
    - unpublished thesis metrics
policy:
  privacy: public-only-with-exact-address-user-approval
  publication_requires_human_review: true
  knowledge_source_read_only: true
  fail_on_unsupported_claims: true
  fail_on_private_content: true
  fail_on_source_mutation: true
validation:
  required_checks:
    - source-containment
    - source-unchanged
    - claim-provenance
    - exact-email-only
    - privacy
    - astro-build
    - generated-output
    - diff-check
