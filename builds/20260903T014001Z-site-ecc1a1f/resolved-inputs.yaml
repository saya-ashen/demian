version: 1
artifact_requirements:
  name: demian-personal-website
  purpose: Public personal research and engineering website and matching public resume.
  audience:
    - research collaborators
    - Ph.D. admissions readers
    - AI engineering collaborators
  language: en
  output_paths:
    - generated/site-content.md
    - generated/public-resume-en.md
    - generated/public-resume-en.typ
    - generated/public-resume-en.pdf
  required_sections:
    - home
    - about
    - education
    - current direction
    - experience timeline
    - projects
    - publications
    - contact
    - one-page public resume
  resume_max_pages: 1

selectors:
  include:
    - reviewed public professional facts from the declared Wiki snapshot
    - exact contact and IELTS facts approved for public release on 2026-09-03
    - Chrona v0.3.1 public alpha release
    - user-approved EWAS and Dingent project evaluation claims
    - official Dingent preprint, iDog correction, EWAS paper, and NGDC 2026 records
  exclude:
    - stale or superseded current-status wording
    - GPA and rank
    - unapproved application, identity, referee, and mobility data
    - any unpublished metric not explicitly approved in source.public-profile-update-2026-09

policy:
  privacy: exact-public-approval-only
  publication_requires_human_review: true
  knowledge_source_read_only_during_artifact_build: true
  fail_on_unsupported_claims: true
  fail_on_private_content: true
  fail_on_source_mutation: true
  project_metric_qualification: project/thesis evidence, not journal-reported metrics
  dingent_handover_qualification: no implication of post-June-2026 project or CNCB-resource control

validation:
  required_checks:
    - source-containment
    - source-lock-hashes
    - source-unchanged
    - claim-provenance
    - numeric-and-date-consistency
    - privacy
    - stale-wording
    - astro-production-build
    - generated-output-inspection
    - typst-compilation
    - resume-page-count
    - resume-text-inspection
    - output-hashes

build_inputs:
  - path: AGENTS.md
    role: publication-and-privacy-requirements
    sha256: 8483c1383b0545555123c957108110dc3513aadb3d96bfbd3752a153f5e70726
  - path: README.md
    role: repository-structure-and-build-commands
